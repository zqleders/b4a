name: Auto Deploy to B4A

on:
#  schedule:
#    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 必须加上这一行，赋予 GitHub Actions 对仓库内容的写权限，才能成功推送 url.txt
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行自动化部署脚本
        env:
          B4A_EMAIL: ${{ secrets.B4A_EMAIL }}
          B4A_PASSWORD: ${{ secrets.B4A_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          B4A_LOGIN_URL: ${{ secrets.B4A_LOGIN_URL }}
          B4A_CONTAINER_URL: ${{ secrets.B4A_CONTAINER_URL }}
          
        run: |
          python deploy.py

      - name: 自动提交并推送 url.txt 更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add url.txt
          # 如果 url.txt 没有发生变化，git commit 会提示无修改，因此用 || true 防止流程中断
          git commit -m "chore: update latest b4a domain url.txt [skip ci]" || true
          git push
